<svg xmlns="http://www.w3.org/2000/svg" width="1856" height="994" viewBox="0 0 1856 994" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" style="white-space:pre">
  <rect width="1856" height="994" fill="#eef1f7"/>

  <!-- panel 1: before and after templatize -->
  <g transform="translate(40,40)">
    <rect width="900" height="440" rx="14" fill="#ffffff" stroke="#d9dee8"/>
    <text x="28" y="46" font-size="26" font-weight="700" fill="#090d16">Before and after /templatize</text>
    <text x="28" y="76" font-size="18" fill="#626978">the copy moves out, the class names stay, the pixels do not change</text>

    <!-- before -->
    <text x="28" y="112" font-size="14" font-weight="700" fill="#626978" letter-spacing="1">BEFORE</text>
    <rect x="28" y="122" width="412" height="190" rx="10" fill="#0e141f"/>
    <g font-size="16" fill="#dfe4ee">
      <text x="44" y="150"><tspan fill="#c792ea">export function</tspan> Hero() {</text>
      <text x="44" y="176">  &lt;<tspan fill="#6492ff">section</tspan> className=<tspan fill="#9ad38a">"px-6 py-24"</tspan>&gt;</text>
      <text x="44" y="202">    &lt;<tspan fill="#6492ff">h1</tspan> className=<tspan fill="#9ad38a">"text-5xl"</tspan>&gt;</text>
      <text x="44" y="228" fill="#ff8f8f">      Ship faster with Acme</text>
      <text x="44" y="254">    &lt;/<tspan fill="#6492ff">h1</tspan>&gt;</text>
      <text x="44" y="280">    &lt;<tspan fill="#6492ff">a</tspan> href=<tspan fill="#ff8f8f">"/signup"</tspan>&gt;<tspan fill="#ff8f8f">Start free</tspan>&lt;/<tspan fill="#6492ff">a</tspan>&gt;</text>
    </g>

    <!-- after -->
    <text x="460" y="112" font-size="14" font-weight="700" fill="#626978" letter-spacing="1">AFTER</text>
    <rect x="460" y="122" width="412" height="190" rx="10" fill="#0e141f"/>
    <g font-size="16" fill="#dfe4ee">
      <text x="476" y="150"><tspan fill="#c792ea">export function</tspan> Hero({ content }) {</text>
      <text x="476" y="176">  &lt;<tspan fill="#6492ff">section</tspan> className=<tspan fill="#9ad38a">"px-6 py-24"</tspan>&gt;</text>
      <text x="476" y="202">    &lt;<tspan fill="#6492ff">h1</tspan> className=<tspan fill="#9ad38a">"text-5xl"</tspan>&gt;</text>
      <text x="476" y="228" fill="#ffffff" font-weight="700">      {content.hero.title}</text>
      <text x="476" y="254">    &lt;/<tspan fill="#6492ff">h1</tspan>&gt;</text>
      <text x="476" y="280">    &lt;<tspan fill="#6492ff">Link</tspan> href={content.cta.href}&gt;</text>
    </g>

    <!-- the two files -->
    <g font-size="15" fill="#626978">
      <text x="28" y="344" font-weight="700" fill="#090d16">content/home.json</text>
      <text x="28" y="368" fill="#090d16">{ "hero": { "title": <tspan fill="#1f7a5c">"Ship faster with Acme"</tspan> } }</text>
      <text x="460" y="344" font-weight="700" fill="#090d16">src/content/pages/home.ts</text>
      <text x="460" y="368" fill="#090d16">hero: z.object({ title: <tspan fill="#3060e6">text("Headline")</tspan> })</text>
      <text x="28" y="404">The schema is the only thing you write. It validates the JSON, types the prop,</text>
      <text x="28" y="426">and draws the form control in the editor. No second source of truth.</text>
    </g>
  </g>

  <!-- panel 2: the editor -->
  <g transform="translate(980,40)">
    <rect width="836" height="440" rx="14" fill="#ffffff" stroke="#d9dee8"/>
    <text x="28" y="46" font-size="26" font-weight="700" fill="#090d16">The editor at /edit</text>
    <text x="28" y="76" font-size="18" fill="#626978">the form is drawn from the schema; add a field and a control appears</text>

    <!-- editor chrome -->
    <rect x="28" y="96" width="780" height="320" rx="10" fill="#f7f8fb" stroke="#d9dee8"/>
    <rect x="28" y="96" width="780" height="34" rx="10" fill="#ffffff"/>
    <rect x="28" y="120" width="780" height="10" fill="#ffffff"/>
    <line x1="28" y1="130" x2="808" y2="130" stroke="#d9dee8"/>
    <text x="44" y="118" font-size="14" font-weight="700" fill="#090d16">Cloneable editor</text>
    <g font-size="14" fill="#626978"><text x="170" y="118">Content</text><text x="236" y="118">Theme</text><text x="296" y="118">View site</text></g>
    <rect x="712" y="102" width="82" height="22" rx="6" fill="#eef1f7"/>
    <text x="753" y="117" font-size="12" fill="#090d16" text-anchor="middle">Saved</text>

    <!-- form column -->
    <line x1="340" y1="130" x2="340" y2="416" stroke="#d9dee8"/>
    <g font-size="13">
      <text x="44" y="154" font-weight="700" fill="#090d16" font-size="14">Home</text>
      <text x="44" y="170" fill="#626978" font-size="12">content/home.json</text>

      <rect x="44" y="184" width="280" height="110" rx="8" fill="#ffffff" stroke="#d9dee8"/>
      <text x="56" y="203" font-weight="700" fill="#090d16">Hero</text>
      <text x="56" y="222" fill="#626978" font-size="12">Eyebrow</text>
      <rect x="56" y="228" width="256" height="24" rx="5" fill="#ffffff" stroke="#c9d0dc"/>
      <text x="64" y="244" fill="#090d16">Clone → Templatize → Customize</text>
      <text x="56" y="268" fill="#626978" font-size="12">Headline</text>
      <rect x="56" y="274" width="256" height="24" rx="5" fill="#ffffff" stroke="#3060e6"/>
      <text x="64" y="290" fill="#090d16">Every cloned site, editable by anyone</text>

      <rect x="44" y="306" width="280" height="100" rx="8" fill="#ffffff" stroke="#d9dee8"/>
      <text x="56" y="325" font-weight="700" fill="#090d16">Navigation links</text>
      <rect x="56" y="334" width="256" height="26" rx="5" fill="#f7f8fb" stroke="#d9dee8"/>
      <text x="64" y="351" fill="#090d16">How it works</text>
      <g fill="#626978" font-size="12"><text x="250" y="351">▲</text><text x="268" y="351">▼</text><text x="288" y="351">✕</text></g>
      <rect x="56" y="366" width="256" height="26" rx="5" fill="#f7f8fb" stroke="#d9dee8"/>
      <text x="64" y="383" fill="#090d16">Features</text>
      <g fill="#626978" font-size="12"><text x="250" y="383">▲</text><text x="268" y="383">▼</text><text x="288" y="383">✕</text></g>
      <text x="56" y="402" fill="#3060e6" font-size="12">+ Add link</text>
    </g>

    <!-- preview column -->
    <text x="356" y="154" font-size="12" fill="#626978">Preview · /</text>
    <rect x="356" y="164" width="436" height="236" rx="8" fill="#ffffff" stroke="#d9dee8"/>
    <g font-size="12">
      <text x="372" y="190" font-weight="700" fill="#090d16" font-size="13">Cloneable</text>
      <g fill="#626978"><text x="500" y="190">How it works</text><text x="584" y="190">Features</text><text x="644" y="190">Editor</text></g>
      <rect x="684" y="177" width="100" height="20" rx="5" fill="#3060e6"/>
      <text x="734" y="191" fill="#ffffff" text-anchor="middle" font-size="10">Use this template</text>
    </g>
    <rect x="482" y="218" width="184" height="18" rx="9" fill="#eef1f7"/>
    <text x="574" y="231" font-size="10" fill="#626978" text-anchor="middle" letter-spacing="1">CLONE → TEMPLATIZE → CUSTOMIZE</text>
    <text x="574" y="278" font-size="34" font-weight="700" fill="#090d16" text-anchor="middle" letter-spacing="-1">Every cloned site,</text>
    <text x="574" y="316" font-size="34" font-weight="700" fill="#090d16" text-anchor="middle" letter-spacing="-1">editable by anyone</text>
    <rect x="486" y="340" width="86" height="28" rx="6" fill="#3060e6"/>
    <text x="529" y="358" font-size="12" fill="#ffffff" text-anchor="middle">Get started →</text>
    <rect x="582" y="340" width="86" height="28" rx="6" fill="#ffffff" stroke="#d9dee8"/>
    <text x="625" y="358" font-size="12" fill="#090d16" text-anchor="middle">Open the editor</text>
    <rect x="372" y="380" width="404" height="20" rx="4" fill="#3060e6" opacity="0.15"/>

    <text x="28" y="434" font-size="14" fill="#626978">Development only: it writes files into your repository. In production, /edit says "Editor unavailable".</text>
  </g>

  <!-- panel 3: honesty -->
  <g transform="translate(40,520)">
    <rect width="1776" height="434" rx="14" fill="#090d16"/>
    <text x="28" y="50" font-size="26" font-weight="700" fill="#f3f5fa">What keeps it honest</text>
    <text x="28" y="82" font-size="18" fill="#f3f5fa" opacity="0.7">the schema validates on every load, and the placeholder variant ships the structure without the source's words</text>

    <!-- left: build error -->
    <text x="28" y="128" font-size="18" font-weight="700" fill="#f3f5fa">A mismatch fails the build and names the field</text>
    <rect x="28" y="142" width="840" height="150" rx="10" fill="#0e141f" stroke="#2a3550"/>
    <g font-size="16" fill="#dfe4ee">
      <text x="44" y="170"><tspan fill="#8b93a7">$</tspan> npm run build</text>
      <text x="44" y="198" fill="#ff8f8f">content/home.json does not match the "home" schema:</text>
      <text x="44" y="226">  · <tspan fill="#ffd27a">hero.subtitle</tspan>  Invalid input: expected string, received undefined</text>
      <text x="44" y="254">  · <tspan fill="#ffd27a">features.items.0.icon</tspan>  Invalid option: expected one of "sparkles"|"gauge"|"layers"…</text>
      <text x="44" y="282" fill="#8b93a7">The editor saves through the same check, so it cannot write a page that will not build.</text>
    </g>

    <text x="28" y="330" font-size="18" font-weight="700" fill="#f3f5fa">The editor is development only</text>
    <g font-size="16" fill="#dfe4ee">
      <text x="28" y="360">src/lib/content/guard.ts: <tspan fill="#6492ff">EDITOR_ENABLED = process.env.NODE_ENV !== "production"</tspan></text>
      <text x="28" y="388">PUT /api/content/home in production → <tspan fill="#ff8f8f">403</tspan>  "The Cloneable editor is available in development only."</text>
      <text x="28" y="414" fill="#8b93a7">A hosted, unauthenticated write endpoint would be a defacement vector. Edit locally, commit, deploy.</text>
    </g>

    <!-- right: placeholder variant -->
    <text x="908" y="128" font-size="18" font-weight="700" fill="#f3f5fa">The placeholder variant, from content/home.placeholder.json</text>
    <g font-size="15">
      <g fill="#8b93a7"><text x="908" y="160">field</text><text x="1070" y="160">original</text><text x="1420" y="160">placeholder</text></g>
      <line x1="908" y1="170" x2="1748" y2="170" stroke="#2a3550"/>
      <g fill="#dfe4ee">
        <text x="908" y="196">hero.title</text><text x="1070" y="196">Every cloned site, editable by anyone</text><text x="1420" y="196" fill="#ffd27a">Your headline goes here</text>
        <text x="908" y="226">hero.eyebrow</text><text x="1070" y="226">Clone → Templatize → Customize</text><text x="1420" y="226" fill="#ffd27a">Eyebrow Replace this text with your own.</text>
        <text x="908" y="256">hero.image.src</text><text x="1070" y="256">/images/hero-preview.png</text><text x="1420" y="256" fill="#ffd27a">/images/placeholder.png</text>
        <text x="908" y="286">hero.image.width</text><text x="1070" y="286">1200</text><text x="1420" y="286" fill="#9ad38a">1200  kept, it bears layout</text>
        <text x="908" y="316">nav.links[0].href</text><text x="1070" y="316">#how</text><text x="1420" y="316" fill="#9ad38a">#how  kept, internal route</text>
        <text x="908" y="346">footer…links[0].href</text><text x="1070" y="346">https://github.com/vishalmeena2211/cloneable</text><text x="1420" y="346" fill="#ffd27a">#  external link dropped</text>
        <text x="908" y="376">features.items[0].icon</text><text x="1070" y="376">layers</text><text x="1420" y="376" fill="#9ad38a">layers  kept, it is an enum</text>
        <text x="908" y="406">features.items</text><text x="1070" y="406">6 items</text><text x="1420" y="406" fill="#9ad38a">6 items  array length kept</text>
      </g>
    </g>
  </g>
</svg>
