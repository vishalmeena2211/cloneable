<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" style="white-space:pre">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101c3a"/></linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <!-- faint brace texture -->
  <g fill="#ffffff" opacity="0.035" font-size="30" font-weight="700">
    <text x="60" y="80">{ }</text><text x="420" y="130">&lt;/&gt;</text><text x="760" y="70">{ }</text><text x="1480" y="90">&lt;/&gt;</text><text x="1790" y="210">{ }</text><text x="1690" y="540">&lt;/&gt;</text><text x="110" y="560">{ }</text><text x="930" y="580">&lt;/&gt;</text>
  </g>
  <!-- title -->
  <text x="120" y="190" font-size="92" font-weight="700" fill="#f3f5fa" letter-spacing="-2">cloneable</text>
  <text x="124" y="252" font-size="34" fill="#f3f5fa" opacity="0.85">A website becomes a content folder plus a Next.js template. Anyone can edit the words. The pixels stay.</text>

  <g transform="translate(120,310)">
    <!-- captions -->
    <g font-size="20" fill="#f3f5fa" opacity="0.7">
      <text x="0" y="-14">the site you point it at</text>
      <text x="610" y="-14">the component, after /templatize</text>
      <text x="1220" y="-14">the content, in JSON</text>
    </g>

    <!-- card A: the website -->
    <rect x="0" y="0" width="420" height="240" rx="12" fill="#ffffff"/>
    <rect x="0" y="0" width="420" height="36" rx="12" fill="#e6e9f0"/>
    <rect x="0" y="24" width="420" height="12" fill="#e6e9f0"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/><circle cx="38" cy="18" r="5" fill="#febc2e"/><circle cx="56" cy="18" r="5" fill="#28c840"/>
    <rect x="80" y="9" width="250" height="18" rx="9" fill="#ffffff"/>
    <text x="92" y="23" font-size="13" fill="#626978">https://example.com</text>
    <text x="24" y="86" font-size="30" font-weight="700" fill="#090d16" letter-spacing="-0.5">Ship faster with Acme</text>
    <rect x="24" y="104" width="300" height="10" rx="5" fill="#d9dee8"/>
    <rect x="24" y="122" width="240" height="10" rx="5" fill="#d9dee8"/>
    <rect x="24" y="154" width="124" height="38" rx="8" fill="#3060e6"/>
    <text x="86" y="179" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Start free</text>
    <rect x="160" y="154" width="124" height="38" rx="8" fill="#ffffff" stroke="#d9dee8"/>
    <text x="222" y="179" font-size="16" fill="#090d16" text-anchor="middle">See a demo</text>
    <rect x="24" y="208" width="372" height="16" rx="4" fill="#eef1f7"/>

    <!-- arrow 1 -->
    <g stroke="#6492ff" stroke-width="3" fill="none">
      <line x1="440" y1="120" x2="580" y2="120"/>
      <polyline points="566,108 582,120 566,132"/>
    </g>
    <text x="511" y="102" font-size="19" fill="#6492ff" text-anchor="middle">/clone-website</text>
    <text x="511" y="150" font-size="15" fill="#f3f5fa" opacity="0.6" text-anchor="middle">real browser, exact CSS</text>

    <!-- card B: the component -->
    <rect x="610" y="0" width="420" height="240" rx="12" fill="#0e141f" stroke="#2a3550"/>
    <rect x="610" y="0" width="420" height="36" rx="12" fill="#161f31"/>
    <rect x="610" y="24" width="420" height="12" fill="#161f31"/>
    <text x="632" y="24" font-size="15" fill="#8b93a7">src/components/sections/hero.tsx</text>
    <g font-size="18" fill="#dfe4ee">
      <text x="632" y="72"><tspan fill="#c792ea">export function</tspan> Hero({ content })</text>
      <text x="632" y="104">  &lt;<tspan fill="#6492ff">h1</tspan> className=<tspan fill="#9ad38a">"text-5xl"</tspan>&gt;</text>
      <text x="632" y="136" font-weight="700" fill="#ffffff">    {content.hero.title}</text>
      <text x="632" y="168">  &lt;/<tspan fill="#6492ff">h1</tspan>&gt;</text>
      <text x="632" y="200">  &lt;<tspan fill="#6492ff">Link</tspan> href={content.cta.href}&gt;</text>
    </g>
    <rect x="626" y="118" width="388" height="26" rx="5" fill="#3060e6" opacity="0.22"/>
    <text x="1012" y="228" font-size="14" fill="#8b93a7" text-anchor="end">not one class name changed</text>

    <!-- arrow 2 -->
    <g stroke="#6492ff" stroke-width="3" fill="none">
      <line x1="1050" y1="120" x2="1190" y2="120"/>
      <polyline points="1176,108 1192,120 1176,132"/>
    </g>
    <text x="1121" y="102" font-size="19" fill="#6492ff" text-anchor="middle">/templatize</text>
    <text x="1121" y="150" font-size="15" fill="#f3f5fa" opacity="0.6" text-anchor="middle">pixels unchanged</text>

    <!-- card C: the content folder -->
    <rect x="1220" y="0" width="460" height="240" rx="12" fill="#ffffff"/>
    <rect x="1220" y="0" width="460" height="36" rx="12" fill="#e6e9f0"/>
    <rect x="1220" y="24" width="460" height="12" fill="#e6e9f0"/>
    <path d="M1238 12 h12 l4 4 h16 a3 3 0 0 1 3 3 v9 a3 3 0 0 1 -3 3 h-32 a3 3 0 0 1 -3 -3 v-13 a3 3 0 0 1 3 -3z" fill="#f2b84b"/>
    <text x="1282" y="24" font-size="15" fill="#626978">content/home.json</text>
    <g font-size="18" fill="#090d16">
      <text x="1242" y="70">{ <tspan fill="#3060e6">"hero"</tspan>: {</text>
      <text x="1242" y="100">    <tspan fill="#3060e6">"title"</tspan>: <tspan fill="#1f7a5c">"Ship faster with Acme"</tspan>,</text>
      <text x="1242" y="130">    <tspan fill="#3060e6">"cta"</tspan>: { <tspan fill="#3060e6">"label"</tspan>: <tspan fill="#1f7a5c">"Start free"</tspan>,</text>
      <text x="1242" y="160">             <tspan fill="#3060e6">"href"</tspan>: <tspan fill="#1f7a5c">"/signup"</tspan> } } }</text>
    </g>
    <line x1="1240" y1="184" x2="1660" y2="184" stroke="#e6e9f0"/>
    <text x="1242" y="208" font-size="15" fill="#626978">validated by src/content/pages/home.ts</text>
    <text x="1242" y="229" font-size="15" fill="#626978">edited in a form at <tspan fill="#3060e6" font-weight="700">/edit</tspan>, Cmd+S to save</text>
  </g>
</svg>
